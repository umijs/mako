# One-off continuation of release run 39736394333; no tag or source changes.
name: utoopack-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the existing release packages without publishing
        type: boolean
        default: true
        required: true

concurrency:
  group: utoopack-resume-1.5.30
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_RUN: "39736394333"
  RELEASE_SHA: ed83ea164acdcda532318d3f975809e2911932ec
  VERSION: "1.5.30"

jobs:
  publish:
    name: Resume 1.5.30 publication
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ed83ea164acdcda532318d3f975809e2911932ec
      - name: Verify original release and build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api repos/utooland/utoo/git/ref/tags/utoopack-v1.5.30 --jq '.object.sha')" = "$RELEASE_SHA"
          gh api "repos/utooland/utoo/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/utooland/utoo/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const run = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/source-run.json`));
          assert.equal(run.head_sha, process.env.RELEASE_SHA);
          assert.equal(run.head_branch, "utoopack-v1.5.30");
          assert.equal(run.event, "push");
          assert.equal(run.status, "completed");
          assert.equal(run.path, ".github/workflows/pack-release.yml");
          const { jobs } = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/source-jobs.json`));
          const builds = jobs.filter(job => job.name.startsWith("utoopack-release-"));
          assert.equal(builds.length, 7);
          for (const job of builds) assert.equal(job.conclusion, "success", job.name);
          console.log("Verified all seven builds from the original release commit");
          NODE
      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Setup Utoo
        uses: utooland/setup-utoo@e7aa4d726a17f79f68aed736476ea5bd68f8ba52 # v1
        with:
          cache-utoo: false
          utoo-version: 1.1.7

      - name: Install dependencies
        run: utoo install
      - name: Download native binding artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: 39736394333
          github-token: ${{ github.token }}
          pattern: pack-*
          path: ./packages/pack/src
      - name: Download binding loader
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: 39736394333
          github-token: ${{ github.token }}
          name: napi-binding-loader
          path: ./packages/pack/src
      - name: Move artifacts
        run: cd packages/pack && npm run artifacts
      - name: List packages
        run: cd packages/pack && ls -R ./npm
        shell: bash
      - name: Build JS
        run: |
          npm run build --workspace=@utoo/pack-shared
          npm run build:js --workspace=@utoo/pack
          npm run build --workspace=@utoo/pack-cli
      - name: Set existing release version
        id: get_version
        run: echo "VERSION=1.5.30" >> "$GITHUB_OUTPUT"
      - name: Update npm for trusted publishing
        run: npm install -g npm@11.6.2
      - name: Prepare package metadata without publishing
        run: |
          set -euo pipefail
          npm version --workspace=@utoo/pack-shared "$VERSION" --no-git-tag-version --workspaces-update=false
          npm version --workspace=@utoo/pack "$VERSION" --no-git-tag-version --workspaces-update=false
          npm version --workspace=@utoo/pack-cli "$VERSION" --no-git-tag-version --workspaces-update=false
          npm pkg set dependencies.@utoo/pack-shared="$VERSION" --workspace=@utoo/pack
          npm pkg set dependencies.@utoo/pack="$VERSION" --workspace=@utoo/pack-cli
          npm exec --workspace=@utoo/pack -- napi pre-publish -t npm --no-gh-release --skip-optional-publish
          npm run check:binding-version --workspace=@utoo/pack -- "$VERSION"
      - name: Check or publish only missing packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const version = process.env.VERSION;
          assert.ok(["true", "false"].includes(process.env.DRY_RUN));
          const platforms = ["darwin-arm64", "darwin-x64", "linux-arm64-gnu", "linux-arm64-musl", "linux-x64-gnu", "linux-x64-musl", "win32-x64-msvc"];
          const packages = [
            ["packages/pack-shared", "@utoo/pack-shared"],
            ...platforms.map(platform => [`packages/pack/npm/${platform}`, `@utoo/pack-${platform}`]),
            ["packages/pack", "@utoo/pack"],
            ["packages/pack-cli", "@utoo/pack-cli"],
          ];
          function command(args, cwd) {
            const result = spawnSync("npm", args, { cwd, stdio: "inherit", env: process.env });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`npm ${args[0]} failed with status ${result.status}`);
          }
          async function main() {
            for (const [directory, name] of packages) {
              const manifest = JSON.parse(fs.readFileSync(path.join(directory, "package.json")));
              assert.equal(manifest.name, name);
              assert.equal(manifest.version, version);
              if (name === "@utoo/pack") {
                assert.equal(manifest.dependencies["@utoo/pack-shared"], version);
                assert.equal(Object.keys(manifest.optionalDependencies).length, 7);
                for (const platform of platforms) assert.equal(manifest.optionalDependencies[`@utoo/pack-${platform}`], version);
              }
              if (name === "@utoo/pack-cli") assert.equal(manifest.dependencies["@utoo/pack"], version);
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, { signal: AbortSignal.timeout(30000) });
              if (response.ok) {
                const published = await response.json();
                assert.equal(published.name, name);
                assert.equal(published.version, version);
                assert.ok(published.dist?.integrity);
                console.log(`SKIP already published: ${name}@${version}`);
                continue;
              }
              if (response.status !== 404) throw new Error(`Registry check failed for ${name}: HTTP ${response.status}; refusing to publish`);
              console.log(`${process.env.DRY_RUN === "true" ? "CHECK" : "PUBLISH"}: ${name}@${version}`);
              const args = ["publish", "--ignore-scripts", "--access", "public", "--tag", "latest", "--registry=https://registry.npmjs.org", "--loglevel=verbose"];
              if (process.env.DRY_RUN === "true") args.push("--dry-run");
              command(args, directory);
            }
          }
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
  wait_for_npm:
    name: Wait for npm propagation
    if: ${{ !inputs.dry_run }}
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Wait for ecosystem packages
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          : "${VERSION:?VERSION is required}"

          # npm publish can succeed before registry metadata exposes the version.
          # Check all seven platform bindings before consumer validation.
          packages=(@utoo/pack @utoo/pack-shared @utoo/pack-cli @utoo/pack-darwin-arm64 @utoo/pack-darwin-x64 @utoo/pack-linux-arm64-gnu @utoo/pack-linux-arm64-musl @utoo/pack-linux-x64-gnu @utoo/pack-linux-x64-musl @utoo/pack-win32-x64-msvc)
          for attempt in {1..12}; do
            ready=true
            for package in "${packages[@]}"; do
              if version=$(npm view "${package}@${VERSION}" version \
                --registry=https://registry.npmjs.org \
                --prefer-online --fetch-retries=0 --fetch-timeout=10000) && \
                [[ "$version" == "$VERSION" ]]; then
                echo "${package}@${VERSION} is available"
              else
                echo "Waiting for ${package}@${VERSION} (attempt ${attempt}/12)"
                ready=false
                break
              fi
            done

            if [[ "$ready" == true ]]; then
              echo "All ecosystem packages are available on npm"
              exit 0
            fi
            if (( attempt < 12 )); then
              sleep 45
            fi
          done

          echo "::error::npm propagation timed out for ${VERSION}; ecosystem tests were not started"
          exit 1

  ecosystem:
    name: Ecosystem CI
    needs:
      - publish
      - wait_for_npm
    permissions:
      contents: read
    uses: utooland/utoo-ecosystem-ci/.github/workflows/ecosystem-ci.yml@main
    with:
      candidate_mode: npm
      pack_spec: ${{ needs.publish.outputs.version }}
      suite: all
      harness_repository: utooland/utoo-ecosystem-ci
      harness_ref: main
